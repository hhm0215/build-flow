server:
  port: 8086

spring:
  application:
    name: notification-service
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/buildflow_notification?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        retries: 3
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      ack-mode: record

app:
  warranty:
    # 만료 임박 알림 임계치 (일 단위) — 종료일이 오늘 ~ today+threshold 범위면 알림 발송
    alert-threshold-days: 30
    # 동일 보증서 알림 쿨다운 (일 단위) — 마지막 발송 후 N일 지나야 재발송
    alert-cooldown-days: 7
    # 스케줄 cron — 매일 09:00
    scheduler-cron: "0 0 9 * * *"
  upload-dir: ${UPLOAD_DIR:./uploads/warranties}
  # multipart 업로드 제한 (Spring 기본 1MB / 10MB로 줄여진 것을 PDF 사이즈에 맞춰 확장)
  ocr:
    # PDFBox 텍스트 추출 결과가 이 길이 미만이면 Tess4J OCR fallback
    min-text-length: 50
    # 스캔 PDF 렌더링 DPI (높을수록 정확도↑, 처리 시간↑)
    scan-dpi: 300
    # Tesseract traineddata 경로 (Docker: debian jammy 기본 경로)
    tessdata-path: /usr/share/tesseract-ocr/4.00/tessdata
    # Tesseract 인식 언어 (+ 구분)
    languages: kor+eng

servlet:
  multipart:
    max-file-size: 20MB
    max-request-size: 20MB

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    com.buildflow.notification: INFO
