# Synthetic integration only: no host ports, no persistent volumes, no external .env.
x-labels: &labels
  com.buildflow.profit-reconcile-test: ${RECONCILE_NONCE:?Run the Python harness}
x-app-env: &app-env
  DB_HOST: mysql
  DB_USERNAME: root
  DB_PASSWORD: ${RECONCILE_DB_PASSWORD:?Run the Python harness}
  SPRING_CLOUD_CONFIG_ENABLED: "false"
  EUREKA_CLIENT_ENABLED: "false"
  SPRING_FLYWAY_ENABLED: "true"
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  MANAGEMENT_HEALTH_REDIS_ENABLED: "false"
  MANAGEMENT_TRACING_ENABLED: "false"
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  JAVA_TOOL_OPTIONS: -Xms64m -Xmx384m -XX:ActiveProcessorCount=2
  TZ: Asia/Seoul
x-app: &app
  image: eclipse-temurin:17-jre-jammy
  labels: *labels
  read_only: true
  tmpfs: [/tmp]
  mem_limit: 768m

services:
  mysql:
    image: mysql:8.0
    labels: *labels
    environment:
      MYSQL_ROOT_PASSWORD: ${RECONCILE_DB_PASSWORD:?Run the Python harness}
      MYSQL_ROOT_HOST: "%"
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    tmpfs: ["/var/lib/mysql:rw,size=1g"]
    mem_limit: 768m
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -uroot -h127.0.0.1 --protocol=TCP -Nse "SELECT 1"']
      interval: 2s
      timeout: 3s
      retries: 60
  kafka:
    image: bitnamilegacy/kafka:3.7
    labels: *labels
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_CFG_NUM_PARTITIONS: "1"
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    tmpfs: ["/bitnami/kafka:rw,size=256m,uid=1001,gid=1001"]
    mem_limit: 768m
    healthcheck:
      test: [CMD-SHELL, kafka-topics.sh --bootstrap-server localhost:9092 --list]
      interval: 3s
      timeout: 10s
      retries: 40
  probe:
    image: python:3.12-alpine
    labels: *labels
    command: [python, -c, "import time; time.sleep(1800)"]
    read_only: true
    mem_limit: 96m
  site:
    <<: *app
    environment:
      <<: *app-env
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: ${RECONCILE_LISTENERS:-false}
    command:
      - java
      - -jar
      - /app.jar
      - --spring.cloud.openfeign.client.config.siteEstimateProfitSourceClient.url=http://estimate:8082
      - --spring.cloud.openfeign.client.config.sitePurchaseProfitSourceClient.url=http://purchase:8084
    volumes:
      - type: bind
        source: ${RECONCILE_SITE_JAR:?Build bootJar first}
        target: /app.jar
        read_only: true
  estimate:
    <<: *app
    environment:
      <<: *app-env
      APP_OUTBOX_ENABLED: "false"
    command: [java, -jar, /app.jar, --spring.cloud.openfeign.client.config.estimateSiteReferenceClient.url=http://site:8083]
    volumes:
      - type: bind
        source: ${RECONCILE_ESTIMATE_JAR:?Build bootJar first}
        target: /app.jar
        read_only: true
  purchase:
    <<: *app
    environment:
      <<: *app-env
      # This dispatcher lacks an enable switch. Keep it away from the test broker;
      # the harness deliberately replays selected committed outbox payloads.
      KAFKA_BOOTSTRAP_SERVERS: unavailable:9092
      SERVER_PORT: ${RECONCILE_PURCHASE_PORT:-8084}
    command: [java, -jar, /app.jar, --spring.cloud.openfeign.client.config.purchaseSiteReferenceClient.url=http://site:8083]
    volumes:
      - type: bind
        source: ${RECONCILE_PURCHASE_JAR:?Build bootJar first}
        target: /app.jar
        read_only: true

networks:
  default:
    internal: true
    labels: *labels
