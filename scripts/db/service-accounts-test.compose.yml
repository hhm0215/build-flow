services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${ACCOUNT_TEST_ROOT_PASSWORD:?ACCOUNT_TEST_ROOT_PASSWORD must be set by test-service-accounts-docker.ps1}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    labels:
      com.buildflow.account-test: ${ACCOUNT_TEST_NONCE:?ACCOUNT_TEST_NONCE must be set by test-service-accounts-docker.ps1}
    volumes:
      - account_mysql_data:/var/lib/mysql
      - ../../docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql --user=root --host=127.0.0.1 --protocol=TCP --batch --skip-column-names --execute='SELECT COUNT(*) FROM information_schema.schemata WHERE schema_name LIKE \"buildflow\\_%\"' | grep -qx 7"]
      interval: 2s
      timeout: 3s
      retries: 60

  redis:
    image: redis:7.2-alpine
    profiles: ["site-validation"]
    labels:
      com.buildflow.account-test: ${ACCOUNT_TEST_NONCE:?ACCOUNT_TEST_NONCE must be set by test-service-accounts-docker.ps1}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  site-service:
    image: ${ACCOUNT_TEST_SITE_IMAGE:-build-flow-site-service}
    profiles: ["site-validation"]
    ports:
      - "127.0.0.1::8083"
    environment:
      SPRING_CLOUD_CONFIG_ENABLED: "false"
      EUREKA_CLIENT_ENABLED: "false"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
      DB_HOST: mysql
      DB_USERNAME: buildflow_site
      # Set only for the site-validation profile; compose interpolates inactive profiles too.
      DB_PASSWORD: ${SITE_DB_PASSWORD:-}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9
      MANAGEMENT_TRACING_ENABLED: "false"
    labels:
      com.buildflow.account-test: ${ACCOUNT_TEST_NONCE:?ACCOUNT_TEST_NONCE must be set by test-service-accounts-docker.ps1}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  account_mysql_data:
    labels:
      com.buildflow.account-test: ${ACCOUNT_TEST_NONCE:?ACCOUNT_TEST_NONCE must be set by test-service-accounts-docker.ps1}
