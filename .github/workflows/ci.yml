name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  backend:
    name: 백엔드 (Gradle test, JDK 17)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Run tests
        run: ./gradlew test --no-daemon

  auth-flyway:
    name: 인증 DB (Flyway · MySQL 8)
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-placeholder-only
          MYSQL_DATABASE: buildflow_auth_flyway_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    env:
      AUTH_FLYWAY_INTEGRATION: "true"
      DB_USERNAME: root
      DB_PASSWORD: ci-placeholder-only
      JWT_SECRET: ci-only-placeholder-secret-with-more-than-32-characters
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/buildflow_auth_flyway_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Verify opt-in auth migration against fresh MySQL
        run: ./gradlew :auth-service:test --tests com.buildflow.auth.AuthFlywayIntegrationTest --no-daemon
      - name: Assert MySQL integration test actually ran
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          result = Path('auth-service/build/test-results/test/TEST-com.buildflow.auth.AuthFlywayIntegrationTest.xml')
          suite = ElementTree.parse(result).getroot()
          assert suite.attrib['tests'] == '1', suite.attrib
          assert suite.attrib['skipped'] == '0', suite.attrib
          assert suite.attrib['failures'] == '0', suite.attrib
          assert suite.attrib['errors'] == '0', suite.attrib
          print('Auth Flyway MySQL integration test executed and passed.')
          PY

