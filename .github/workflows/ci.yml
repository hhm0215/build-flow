  frontend:
    name: 프론트 (lint · test · build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build

  backup-synthetic:
    name: DB+PDF 복구 (합성 Docker)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build isolated auth schema validation image
        run: docker build --file Dockerfile --build-arg SERVICE_NAME=auth-service --tag build-flow-auth-service:latest .
      - name: Snapshot and restore isolated synthetic DB and warranty volume
        run: sh -c 'umask 077; exec pwsh -NoProfile -File scripts/db/test-v2-snapshot-docker.ps1'

  public-compose:
    name: VPS HTTPS (Compose · Caddy)
    runs-on: ubuntu-24.04
    env:
      DB_PASSWORD: ci-placeholder-only
      JWT_SECRET: ci-placeholder-only
      PUBLIC_HOST: example.org
    steps:
      - uses: actions/checkout@v7
      - name: Test release evidence generator
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Test cross-agent session fallback
        run: python3 -m unittest discover -s scripts/agents -p 'test_*.py'
      - name: Test exposure validator
        run: python3 -m unittest discover -s scripts/vps -p 'test_verify_*_compose.py'
      - name: Validate Unix backup privacy gate
        run: |
          pwsh -NoProfile -File scripts/db/test-private-backup-path.ps1
          sh -c 'umask 077; exec pwsh -NoProfile -File scripts/db/test-private-backup-path.ps1 -CheckActiveUmask'
      - name: Validate Compose exposure and CORS
        run: |
          docker compose -f docker-compose.yml -f docker-compose.app.yml -f docker-compose.vps.yml -f docker-compose.public.yml config --format json \
            | python3 scripts/vps/verify_public_compose.py
      - name: Validate LAN Compose exposure and CORS
        env:
          LAN_BIND_ADDRESS: 192.168.0.20
        run: |
          docker compose -f docker-compose.yml -f docker-compose.app.yml -f docker-compose.lan.yml config --format json \
            | python3 scripts/vps/verify_lan_compose.py
      - name: Validate Caddyfile syntax
        run: |
          docker run --rm --entrypoint caddy -e PUBLIC_HOST=example.org \
            -v "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine adapt --config /etc/caddy/Caddyfile --validate
      - name: Validate frontend Nginx syntax
        run: |
          docker run --rm --add-host gateway-server:127.0.0.1 \
            -v "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t

  windows-readiness:
    name: Windows (PowerShell · Gradle Wrapper)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 -Recurse -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Validate database backup tools
        shell: powershell
        run: |
          .\scripts\db\test-backup-tools.ps1
          .\scripts\db\test-private-backup-path.ps1
          .\scripts\db\test-restored-warranty-rows.ps1
          .\scripts\db\test-warranty-volume-preflight.ps1
          .\scripts\db\test-warranty-snapshot.ps1
          .\scripts\db\test-warranty-restore-volume.ps1
      - name: Validate read-only USB inventory with synthetic files
        shell: powershell
        run: .\scripts\usb\test-inventory-estimates.ps1
      - name: Validate administrator smoke verifier
        shell: powershell
        run: .\scripts\test-verify-admin.ps1
      - name: Validate Gradle Wrapper
        shell: powershell
        run: .\gradlew.bat --version

  release-candidate:
    name: 릴리스 후보 증거 (배포 아님)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [backend, auth-flyway, chat-flyway, estimate-flyway, purchase-flyway, tax-flyway, site-flyway, frontend, backup-synthetic, public-compose, windows-readiness]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out exact CI commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test release evidence generator
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Create non-deployable release evidence
        env:
          RESULT_BACKEND: ${{ needs.backend.result }}
          RESULT_AUTH_FLYWAY: ${{ needs['auth-flyway'].result }}
          RESULT_CHAT_FLYWAY: ${{ needs['chat-flyway'].result }}
          RESULT_ESTIMATE_FLYWAY: ${{ needs['estimate-flyway'].result }}
          RESULT_PURCHASE_FLYWAY: ${{ needs['purchase-flyway'].result }}
          RESULT_TAX_FLYWAY: ${{ needs['tax-flyway'].result }}
          RESULT_SITE_FLYWAY: ${{ needs['site-flyway'].result }}
          RESULT_FRONTEND: ${{ needs.frontend.result }}
          RESULT_BACKUP_SYNTHETIC: ${{ needs['backup-synthetic'].result }}
          RESULT_PUBLIC_COMPOSE: ${{ needs['public-compose'].result }}
          RESULT_WINDOWS_READINESS: ${{ needs['windows-readiness'].result }}
        run: python3 scripts/ci/create_release_candidate.py --output "$RUNNER_TEMP/release-candidate.json"
      - name: Store release evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/release-candidate.json
          if-no-files-found: error
          retention-days: 14
