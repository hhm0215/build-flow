name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  backend:
    name: 백엔드 (Gradle test, JDK 17)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Run tests
        run: ./gradlew test --no-daemon

  auth-flyway:
    name: 인증 DB (Flyway · MySQL 8)
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-placeholder-only
          MYSQL_DATABASE: buildflow_auth_flyway_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    env:
      AUTH_FLYWAY_INTEGRATION: "true"
      DB_USERNAME: root
      DB_PASSWORD: ci-placeholder-only
      JWT_SECRET: ci-only-placeholder-secret-with-more-than-32-characters
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/buildflow_auth_flyway_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Verify opt-in auth migration against fresh MySQL
        run: ./gradlew :auth-service:test --tests com.buildflow.auth.AuthFlywayIntegrationTest --no-daemon

  frontend:
    name: 프론트 (lint · test · build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build

  public-compose:
    name: VPS HTTPS (Compose · Caddy)
    runs-on: ubuntu-24.04
    env:
      DB_PASSWORD: ci-placeholder-only
      JWT_SECRET: ci-placeholder-only
      PUBLIC_HOST: example.org
    steps:
      - uses: actions/checkout@v7
      - name: Test exposure validator
        run: python3 -m unittest discover -s scripts/vps -p 'test_verify_public_compose.py'
      - name: Validate Compose exposure and CORS
        run: |
          docker compose -f docker-compose.yml -f docker-compose.app.yml -f docker-compose.vps.yml -f docker-compose.public.yml config --format json \
            | python3 scripts/vps/verify_public_compose.py
      - name: Validate Caddyfile syntax
        run: |
          docker run --rm --entrypoint caddy -e PUBLIC_HOST=example.org \
            -v "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine adapt --config /etc/caddy/Caddyfile --validate
      - name: Validate frontend Nginx syntax
        run: |
          docker run --rm --add-host gateway-server:127.0.0.1 \
            -v "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t

  windows-readiness:
    name: Windows (PowerShell · Gradle Wrapper)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 -Recurse -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Validate database backup tools
        shell: powershell
        run: .\scripts\db\test-backup-tools.ps1
      - name: Validate administrator smoke verifier
        shell: powershell
        run: .\scripts\test-verify-admin.ps1
      - name: Validate Gradle Wrapper
        shell: powershell
        run: .\gradlew.bat --version
