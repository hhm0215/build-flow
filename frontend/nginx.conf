map $http_x_forwarded_for $login_limit_key {
    default $http_x_forwarded_for;
    "" $binary_remote_addr;
}

limit_req_zone $login_limit_key zone=login_limit:10m rate=6r/m;
# refresh는 access 만료(30분)마다 탭당 1회 수준. 여러 탭·재진입 여유를 두고 남용만 막는다.
limit_req_zone $login_limit_key zone=refresh_limit:10m rate=30r/m;

# 정적 응답 캐시 정책. location 안에 add_header를 두면 server의 보안 헤더 상속이 끊기므로
# server 수준 add_header 하나로 경로별 값을 고른다(빈 값이면 Nginx가 헤더를 붙이지 않는다).
# - /assets/: Vite가 내용 해시를 파일명에 넣으므로 1년 immutable.
# - 그 외(index.html·SPA fallback): 배포 직후 옛 index.html이 옛 청크를 가리키지 않도록 매번 재검증.
# - /api/: 업스트림(Gateway) 응답의 캐시 정책을 그대로 둔다.
# add_header에 always가 없으므로 404 등 오류 응답에는 붙지 않는다.
map $uri $static_cache_control {
    ~^/api/     "";
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 80;
    # Frontend permits 20 MiB files; leave room for multipart framing.
    client_max_body_size 22m;
    root /usr/share/nginx/html;
    index index.html;

    # CSP는 LAN·공개 경로 모두 이 Nginx를 지나므로 여기서 한 번만 붙인다(Caddy는 중복 설정하지 않음).
    # 현재는 Report-Only — 위반은 브라우저 콘솔에만 남고 차단하지 않는다. enforce 전환은 별도 결정.
    # style-src 'unsafe-inline': Ant Design CSS-in-JS의 <style> 주입과 React style 속성에 필요.
    # fonts.googleapis.com/fonts.gstatic.com: index.css의 Inter 웹폰트 @import (자체 호스팅 시 제거).
    # 하위 location에 add_header를 두면 이 값이 상속되지 않으므로 location에는 add_header를 쓰지 않는다.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # LAN 직결 경로(Caddy 없음)에도 공개 경로와 같은 기본 보안 헤더를 붙인다. 값은 deploy/caddy/Caddyfile과 같게 유지.
    # 공개 경로에서는 Caddy가 header_down으로 이 사본을 지우고 자기 값을 한 번만 붙인다(중복 헤더 방지).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control $static_cache_control;

    # React Router — 모든 경로를 index.html로
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 해시 자산은 없으면 404 — index.html(text/html)을 200으로 돌려주면 옛 청크 요청이
    # "MIME type text/html" 모듈 오류가 되어 앱의 청크 재시도 로직도 원인을 숨긴다.
    location /assets/ {
        try_files $uri =404;
        error_page 404 @missing_asset;
    }

    # 없는 자산의 404 본문도 HTML이 아닌 짧은 텍스트로 둔다(모듈 스크립트로 오인될 여지 제거).
    location @missing_asset {
        types { }
        default_type text/plain;
        return 404 "Not Found\n";
    }

    # 채팅 SSE 스트리밍 — 버퍼링 금지 (버퍼링 시 토큰이 뭉쳐서 도착)
    location /api/v1/chat/ {
        proxy_pass http://gateway-server:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # API 요청을 Gateway로 프록시
    location = /api/v1/auth/login {
        limit_req zone=login_limit burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://gateway-server:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    }

    # 429는 프론트에서 일시 장애로 취급돼 세션을 지우지 않는다(400/401/403/404만 세션 종료).
    location = /api/v1/auth/refresh {
        limit_req zone=refresh_limit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://gateway-server:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://gateway-server:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
