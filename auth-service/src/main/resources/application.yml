server:
  port: 8081

spring:
  application:
    name: auth-service
  config:
    # Docker는 CONFIG_SERVER_URL=http://config-server:8888, 로컬 기본은 localhost (import는 이 한 곳에서만 선언)
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/buildflow_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
  flyway:
    enabled: false
    baseline-on-migrate: false
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000     # 30분
  refresh-token-expiration: 604800000  # 7일
  # 최초 로그인부터의 절대 세션 상한. refresh 회전으로 늘어나지 않는다(JWT_SESSION_ABSOLUTE_EXPIRATION으로 덮어쓰기)
  session-absolute-expiration: 604800000  # 7일
  # 여러 탭이 같은 refresh로 동시에 재발급할 때 직전 토큰을 재사용 탐지 없이 거부만 하는 유예
  refresh-reuse-grace: 30000  # 30초

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    com.buildflow.auth: INFO
