server:
  port: 8082

spring:
  cloud:
    openfeign:
      client:
        config:
          # 현장 참조 검증은 DB 트랜잭션 안에서 호출되므로 기본 10s/60s 대신 짧게 제한하고 실패 시 503
          estimateSiteReferenceClient:
            connect-timeout: 2000
            read-timeout: 3000
  application:
    name: estimate-service
  config:
    # Docker는 CONFIG_SERVER_URL=http://config-server:8888, 로컬 기본은 localhost (import는 이 한 곳에서만 선언)
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/buildflow_estimate?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        retries: 3
    consumer:
      group-id: estimate-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.buildflow.*"
        isolation.level: read_committed
      enable-auto-commit: false
    listener:
      ack-mode: record
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

ollama:
  api:
    url: ${OLLAMA_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen2.5:7b}
    timeout: 120

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    com.buildflow.estimate: INFO
