services:
  # ─────────────────────────────────────────
  # MySQL — 서비스별 스키마 분리
  # ─────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: buildflow-mysql
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD must be set in .env}}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buildflow-net

  # ─────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: buildflow-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buildflow-net

  # ─────────────────────────────────────────
  # Kafka (KRaft mode — ZooKeeper 없이)
  # PLAINTEXT: 컨테이너 간 내부 통신 (kafka:9092)
  # EXTERNAL:  호스트에서 직접 접근 (localhost:9094)
  # ─────────────────────────────────────────
  kafka:
    # bitnami/kafka는 2025년 Docker Hub 무료 배포 중단 → bitnamilegacy로 드롭인 교체 (KAFKA_CFG_* 동일)
    image: bitnamilegacy/kafka:3.7
    container_name: buildflow-kafka
    ports:
      - "127.0.0.1:9094:9094"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_CFG_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - buildflow-net

  # ─────────────────────────────────────────
  # Ollama — 선택 profile. 기본은 호스트 native Ollama(:11434)를 사용한다.
  # 사용법: --profile container-ollama + OLLAMA_URL=http://ollama:11434
  # ─────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: buildflow-ollama
    profiles: ["container-ollama"]
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - buildflow-net

  # ─────────────────────────────────────────
  # Zipkin — 분산 트레이싱
  # ─────────────────────────────────────────
  zipkin:
    image: openzipkin/zipkin:3
    container_name: buildflow-zipkin
    ports:
      - "127.0.0.1:9411:9411"
    networks:
      - buildflow-net

volumes:
  mysql_data:
  redis_data:
  kafka_data:
  ollama_data:

networks:
  buildflow-net:
    name: buildflow-net
