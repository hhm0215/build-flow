# Apply only after the private VPS files. Publishes Caddy on 80/443; all app/DB
# published ports stay bound to 127.0.0.1 in the base Compose files.
# Business services trust the Gateway's X-User-Id and do not re-check JWTs, so
# their ports are not published at all: only Gateway/frontend stay on loopback
# for the SSH tunnel. Health is checked inside the containers (buildflow-release status).
# Redis (no password, token blacklist), Kafka (event injection) and Zipkin (traces)
# are not published either; MySQL stays on loopback behind its password.
# Network split: Caddy and frontend live only on buildflow-edge; the Gateway joins
# both buildflow-edge and buildflow-net. A compromised proxy/frontend container can
# reach the Gateway (which checks JWTs) but not the header-trusting business
# services, DB, Redis or Kafka. Each service spells out !override (no YAML anchor):
# Compose merges network lists, and CI Compose ignored !reset through an alias.
services:
  redis:
    ports: !reset []
  kafka:
    ports: !reset []
  zipkin:
    ports: !reset []
  eureka-server:
    ports: !reset []
  config-server:
    ports: !reset []
  auth-service:
    ports: !reset []
  estimate-service:
    ports: !reset []
  site-service:
    ports: !reset []
  purchase-service:
    ports: !reset []
  tax-service:
    ports: !reset []
  notification-service:
    ports: !reset []
  chat-service:
    ports: !reset []
  gateway-server:
    environment:
      CORS_ALLOWED_ORIGINS: https://${PUBLIC_HOST:?PUBLIC_HOST must be set in environment},http://localhost:13000,http://127.0.0.1:13000
    networks: !override
      - buildflow-net
      - buildflow-edge
  frontend:
    networks: !override
      - buildflow-edge

  caddy:
    image: caddy:2-alpine
    container_name: buildflow-caddy
    restart: unless-stopped
    mem_limit: 192m
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST must be set in environment}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: !override
      - buildflow-edge

networks:
  buildflow-edge:
    name: buildflow-edge

volumes:
  caddy_data:
  caddy_config:
