# Apply only after the private VPS files. Publishes Caddy on 80/443; all app/DB
# published ports stay bound to 127.0.0.1 in the base Compose files.
services:
  gateway-server:
    environment:
      CORS_ALLOWED_ORIGINS: https://${PUBLIC_HOST:?PUBLIC_HOST must be set in environment},http://localhost:13000,http://127.0.0.1:13000

  caddy:
    image: caddy:2-alpine
    container_name: buildflow-caddy
    restart: unless-stopped
    mem_limit: 192m
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST must be set in environment}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - buildflow-net

volumes:
  caddy_data:
  caddy_config:
